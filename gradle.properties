# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft 26.1 / NeoForge userdev requires Java 25.
# Use a repo-local JDK so the branch can build even if the machine default is older.
org.gradle.java.home=H:/grant/IntellJ Imports/BitsAndBalance/.local-tools/jdk-25.0.2+10
## Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1
# Advertise this release for the tested 26.1 line without changing the compile target coordinates.
fabric_minecraft_version_range=>=26.1 <26.1.3
supported_minecraft_versions=26.1,26.1.1,26.1.2
# The active NeoForge 26.1 userdev currently reports Minecraft as 26.1-snapshot-1.
# Use that lower bound so the mod metadata matches the runtime identifier during bring-up.
minecraft_version_range=[26.1,27)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.0.8-beta
# The Neo version range can use any version of Neo as bounds
neo_version_range=[26,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)
parchment_minecraft_version=
parchment_mappings_version=

# Fabric (used by :fabric)
fabric_loader_version=0.18.4
fabric_api_version=0.144.0+26.1

# Optional dev dependency (used for JEI integration when present)
jei_version=29.2.0.21
fabric_loom_version=1.15-20260313.091358-5

# Jade (optional)
# Fabric and NeoForge use different published artifacts/versions for the same MC range.
jade_fabric_version=21.1.1+fabric
jade_neoforge_version=21.0.1+neoforge
enable_jei_compat=false
enable_jade_compat=false

## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=bitsandbalance
# The human-readable display name for the mod.
mod_name=Bits and Balance
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=2.2.2
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=org.grantismantis
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Pockett
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Over 100 small mod ideas packed into one highly configurable mod. New features, balance changes, new gameplay mechanics, etc.


